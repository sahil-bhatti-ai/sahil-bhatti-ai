<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title desc">
<title id="title">Two data distributions: training data and new data</title>
<desc id="desc">A simple notebook-style drawing showing a shift from training data to new data. The question is how models behave when data changes.</desc>
<rect width="900" height="190" fill="#f7f7f2"/>
<rect x="0.5" y="0.5" width="899" height="189" fill="none" stroke="#d4d6ce"/>
<text x="24" y="28" font-family="monospace" font-size="12" fill="#676c62">fig. 01 / a small question</text>
<path d="M 54 147 H 440 M 54 147 V 45" stroke="#777c76" stroke-width="1" fill="none"/>
<path d="M 60 146 C 108 146, 109 63, 168 63 C 229 63, 230 146, 293 146" stroke="#485d6a" stroke-width="2" fill="none"/>
<path d="M 144 146 C 202 146, 209 65, 268 65 C 331 65, 341 146, 399 146" stroke="#9c745b" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
<path d="M 166 51 L 166 150 M 266 52 L 266 150" stroke="#d9dcd5" stroke-width="1" stroke-dasharray="3 5"/>
<text x="118" y="43" font-family="monospace" font-size="12" fill="#485d6a">train</text>
<text x="260" y="43" font-family="monospace" font-size="12" fill="#9c745b">new data</text>
<text x="56" y="168" font-family="monospace" font-size="11" fill="#676c62">different data, same model</text>
<line x1="472" y1="36" x2="472" y2="155" stroke="#d6d9d2"/>
<text x="500" y="70" font-family="monospace" font-size="17" fill="#303c38">model(x) -&gt; prediction</text>
<text x="500" y="103" font-family="monospace" font-size="15" fill="#5f6863">what if x changes?</text>
<text x="500" y="130" font-family="monospace" font-size="12" fill="#727a72">read. test. check. repeat.</text>
<text x="868" y="169" text-anchor="end" font-family="monospace" font-size="10" fill="#8a9088">not to scale</text>
</svg>